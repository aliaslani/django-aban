{% extends 'base.html' %}{% block content %}<h2>{{ product.name }}</h2>
<form method="post">{% csrf_token %}{{ form.as_p }}<button>Calculate</button></form>{% if result %}<dl>
    <dt>Subtotal</dt>
    <dd>{{ result.subtotal }}</dd>
    <dt>Discount</dt>
    <dd>{{ result.discount }}</dd>
    <dt>Total</dt>
    <dd>{{ result.total }}</dd>
</dl>{% endif %}{% endblock %}
